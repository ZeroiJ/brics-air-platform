# Render Blueprint — deploy both services in one click.
# Usage: Render dashboard -> New -> Blueprint -> select this repo -> Apply.
# Requires: the 4 API keys added under Dashboard -> Environments (or manually below).

services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: brics-air-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAQ_API_KEY
        sync: false        # fill in the Dashboard prompt after deploy
      - key: FIRMS_API_KEY
        sync: false
      - key: WAQI_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_RETRIES
        value: "5"

  # ----------------------------------------------------------------- frontend
  - type: web
    name: brics-air-frontend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run frontend/app.py --server.port 8501 --server.address 0.0.0.0
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      - key: BACKEND_URL
        fromService:
          type: web
          name: brics-air-backend
          property: hostport   # internal URL: http://brics-air-backend:8000