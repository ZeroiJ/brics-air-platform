# Render Blueprint — deploy both services in one click.
# Usage: Render dashboard -> New -> Blueprint -> select this repo -> Apply.
# Requires: the 4 API keys added under Dashboard -> Environments (or manually below).

services:
  # ------------------------------------------------------------------ backend
  - type: web
    name: brics-air-backend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.10"
      - key: OPENAQ_API_KEY
        sync: false        # fill in the Dashboard prompt after deploy
      - key: FIRMS_API_KEY
        sync: false
      - key: WAQI_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_RETRIES
        value: "5"

  # ----------------------------------------------------------------- frontend
  - type: web
    name: brics-air-frontend
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    # `echo` first so the effective BACKEND_URL is visible in the service log at
    # process start. Streamlit only executes app.py when a browser connects, so a
    # misconfigured BACKEND_URL used to leave no trace in the logs at all — the
    # only symptom was a silently empty dashboard. `exec` keeps streamlit as
    # PID 1 so it still receives Render's stop signals.
    startCommand: >-
      sh -c 'echo "[startup] BACKEND_URL=$BACKEND_URL";
      exec streamlit run frontend/app.py --server.port $PORT --server.address 0.0.0.0'
    healthCheckPath: /_stcore/health
    autoDeploy: true
    envVars:
      # NOTE: do NOT replace this with `fromService: {property: hostport}`.
      # Render's FREE tier has no private networking, so the internal hostname
      # it yields ("brics-air-backend:10800") never resolves from the frontend
      # container — the dashboard silently drops to offline mock mode. Worse,
      # `fromService` is re-synced from this blueprint on EVERY deploy, which
      # reverts any manual correction made in the dashboard. Hardcode the public
      # URL (work-division.md -> Deployment -> Frontend).
      - key: BACKEND_URL
        value: https://brics-air-backend.onrender.com